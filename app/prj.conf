# ---------------------------------------------------------------------------
# E-001/E-002 base configuration
# ---------------------------------------------------------------------------

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_GPIO=y

CONFIG_ASSERT=y

# ---------------------------------------------------------------------------
# Authority lock (E-003 adds C BUILD_ASSERT backstops)
# ---------------------------------------------------------------------------

CONFIG_ECU_TORQUE_AUTHORITY=n
CONFIG_ECU_INVERTER_ENABLE_AUTHORITY=n
CONFIG_ECU_FIRMWARE_OK_AUTHORITY=n

# ---------------------------------------------------------------------------
# Static runtime
# ---------------------------------------------------------------------------
#
# The v2.10.7 oracle is fully static (StaticTask_t / StaticQueue_t) and already
# enforces that with a CI gate. The Zephyr runtime keeps the same property.

CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# ---------------------------------------------------------------------------
# Peripherals not yet owned by this migration stage
# ---------------------------------------------------------------------------
#
# ADC ownership is an open decision recorded in the E-000 plan (seam 4.2): the
# generic subsystem stays out until E008_ADC_OWNERSHIP_AUDIT.md concludes.

CONFIG_ADC=n
CONFIG_CAN=n
CONFIG_PWM=n
CONFIG_SPI=n
CONFIG_I2C=n
CONFIG_WATCHDOG=n
